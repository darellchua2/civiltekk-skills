name: Release

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release manually'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Run bats tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install bats
        run: |
          if [ -d tests/lib/bats-core ]; then
            echo "Using vendored bats-core"
            export PATH="$PWD/tests/lib/bats-core/bin:$PATH"
          else
            sudo apt-get update && sudo apt-get install -y bats
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Registry drift guard
        run: |
          echo "Checking installer/registry.json is in sync with agent/skill frontmatter..."
          node installer/build-registry.mjs --check

      - name: Lint .mjs + package.json + npx tarball guard
        run: |
          echo "Syntax-checking .mjs files..."
          node --check installer/init.mjs installer/source.mjs installer/build-site.mjs
          echo "Validating package.json..."
          jq . package.json
          echo "Checking npx tarball includes source tree..."
          tarball="$(npm pack --dry-run 2>&1)"
          echo "$tarball" | grep -q " skills/" && echo "$tarball" | grep -q " agents/" && echo "$tarball" | grep -q " installer/" \
            && echo "source tree + installer in tarball ✓" \
            || { echo "FAIL: skills/, agents/ or installer/ missing from tarball"; exit 1; }

      - name: Run tests
        run: |
          export PATH="$PWD/tests/lib/bats-core/bin:$PATH"
          for f in tests/*.bats; do
            echo "=== Running $f ==="
            bats "$f" || exit 1
          done

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test
    # opencode convention: merging to dev does NOT release. Stable releases are a
    # deliberate manual act — workflow_dispatch with create_release=true.
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint validation
        run: |
          echo "Validating deploy/opencode.json..."
          jq . deploy/opencode.json
          echo "opencode.json is valid"

          echo "Validating deploy/setup.sh syntax..."
          bash -n deploy/setup.sh
          echo "setup.sh syntax is valid"
        continue-on-error: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Create Release with CHANGELOG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Running semantic-release..."
          echo "📝 This will:"
          echo "   1. Analyze commits to determine version bump"
          echo "   2. Update VERSION file with new version"
          echo "   3. Update CHANGELOG.md with release notes"
          echo "   4. Create git tag (vX.Y.Z)"
          echo "   5. Create GitHub release"
          echo ""
          npx semantic-release

      - name: Upload CHANGELOG as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CHANGELOG
          path: CHANGELOG.md
          retention-days: 30

  pages:
    name: Deploy catalog to Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build catalog site
        run: node installer/build-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        timeout-minutes: 15
        continue-on-error: true
      - name: Retry deploy on failure
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        timeout-minutes: 15
